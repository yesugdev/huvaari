<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>МТ хичээлийн хуваарь</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a "bell board" — live status panel on top, today's run of periods beside it, the full week grid below */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18212b; --muted:#5d6b79; --line:#d5dce3;
  --accent:#e0a21b; --accent-ink:#3a2a00; --live:#1f8a5b; --free:#8a96a3;
  --tint-l:92%; --tint-s:62%; --tint-ink-l:28%;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161d; --surface:#18212b; --ink:#e6ebf0; --muted:#98a6b4; --line:#2a3542;
  --accent:#f0b73a; --accent-ink:#2a1e00; --live:#3cc489; --free:#6c7987;
  --tint-l:24%; --tint-s:38%; --tint-ink-l:84%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161d; --surface:#18212b; --ink:#e6ebf0; --muted:#98a6b4; --line:#2a3542;
  --accent:#f0b73a; --accent-ink:#2a1e00; --live:#3cc489; --free:#6c7987;
  --tint-l:24%; --tint-s:38%; --tint-ink-l:84%; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
header h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3.4vw,32px);line-height:1.15;margin:4px 0 0;text-wrap:balance}
.clock{text-align:right}
.clock .time{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:clamp(30px,5vw,46px);font-weight:600;line-height:1}
.clock .time .sec{color:var(--muted);font-size:.55em}
.clock .date{color:var(--muted);margin-top:4px}
.sim-badge{display:inline-block;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}

.top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.top{grid-template-columns:minmax(0,1fr)}.clock{text-align:left}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.status{display:grid;gap:16px;position:relative;overflow:hidden}
.status::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--state,var(--free))}
.state-chip{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;color:var(--state,var(--free))}
.state-chip .dot{width:10px;height:10px;border-radius:50%;background:currentColor}
.status.is-live .dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
.now-title{font-family:var(--f-display);font-weight:500;font-size:clamp(19px,2.6vw,25px);line-height:1.25;margin:0;text-wrap:balance}
.now-sub{color:var(--muted);margin-top:4px}
.bar{height:12px;border-radius:6px;background:color-mix(in srgb,var(--line) 70%,transparent);overflow:hidden}
.bar > i{display:block;height:100%;width:0;background:var(--state,var(--free));border-radius:6px;transition:width .6s linear}
.bar-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.big-left{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:clamp(34px,6vw,52px);font-weight:600;line-height:1}
.big-left small{font-size:.35em;color:var(--muted);font-family:var(--f-body);font-weight:500;margin-left:6px}
.next{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:baseline}
.next .cd{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;color:var(--ink)}

.today h2,.week h2{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0}
.today-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.day-tabs{display:flex;gap:4px;flex-wrap:wrap}
.day-tabs button{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 8px;cursor:pointer}
.day-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.day-tabs button.is-today{border-color:var(--accent)}
.day-tabs button:focus-visible,.cell:focus-visible,.ctrl button:focus-visible,.ctrl input:focus-visible,.ctrl select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
ol.periods{list-style:none;margin:0;padding:0;display:grid;gap:2px}
ol.periods li{display:grid;grid-template-columns:22px 92px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;border-radius:6px}
ol.periods li .n{color:var(--muted);font-size:12px;text-align:right}
ol.periods li .t{font-size:13px;color:var(--muted)}
ol.periods li .s{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.periods li.empty .s{color:var(--free)}
ol.periods li.has{background:hsl(var(--h) var(--tint-s) var(--tint-l))}
ol.periods li.has .s{color:hsl(var(--h) 55% var(--tint-ink-l));font-weight:600}
ol.periods li.done{opacity:.5}
ol.periods li.cur{outline:2px solid var(--state,var(--live));outline-offset:-2px}
ol.periods li.lunch{grid-template-columns:1fr;padding:2px 8px;color:var(--muted);font-size:12px;text-align:center}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.tag.live{color:var(--live)}.tag.soon{color:var(--accent)}.tag.fin{color:var(--free)}

.week-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend button{font:inherit;font-size:12px;font-weight:600;border:0;border-radius:999px;padding:3px 10px;cursor:pointer;
  background:hsl(var(--h) var(--tint-s) var(--tint-l));color:hsl(var(--h) 55% var(--tint-ink-l))}
.legend button[aria-pressed="false"]{opacity:.35}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:separate;border-spacing:3px;width:100%;min-width:760px;table-layout:fixed}
.grid th{font-size:12px;font-weight:600;color:var(--muted);padding:6px 4px;text-align:center}
.grid th.today-col{color:var(--accent-ink);background:var(--accent);border-radius:6px}
.grid th.row{text-align:left;width:96px;font-family:var(--f-mono);font-weight:400;font-variant-numeric:tabular-nums}
.grid th.row.cur-row{color:var(--ink);font-weight:600}
.grid col.wk{width:60px}
.grid td{height:52px;padding:0;border-radius:6px;background:color-mix(in srgb,var(--line) 35%,transparent)}
.grid td.today-col{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.cell{all:unset;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;width:100%;height:100%;padding:4px 8px;border-radius:6px;cursor:pointer;
  background:hsl(var(--h) var(--tint-s) var(--tint-l));color:hsl(var(--h) 55% var(--tint-ink-l));transition:transform .15s}
.cell:hover{transform:translateY(-1px)}
.cell b{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.1}
.cell span{font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.is-now{box-shadow:0 0 0 2px var(--live) inset}
.cell.dim{opacity:.18}
.grid td.lunch-row{height:16px;background:transparent;text-align:center;font-size:11px;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border-top:2px solid var(--line);padding-top:8px}
.stat .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:600}

.detail{margin-top:14px;border-radius:8px;padding:12px 14px;background:hsl(var(--h,210) var(--tint-s) var(--tint-l));color:hsl(var(--h,210) 55% var(--tint-ink-l))}
.detail strong{font-family:var(--f-display);font-weight:500}

.ctrl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;font-size:13px;color:var(--muted)}
.ctrl label{display:inline-flex;align-items:center;gap:6px}
.ctrl select,.ctrl input[type=time]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.ctrl button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
footer{font-size:12px;color:var(--muted)}

/* Week as stacked day cards — used on phones instead of the wide table */
.wlist{display:none;gap:10px}
.wday{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.wday.is-today{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.wday h3{margin:0;font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.wday h3 small{color:var(--muted);font-weight:500}
.wday .cell{flex-direction:row;align-items:center;gap:10px;padding:8px 10px;height:auto;min-height:44px}
.wday .cell em{font-style:normal;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;width:88px;flex:none}
.wday .cell b{width:44px;flex:none}
.wday .cell span{flex:1;min-width:0}
.wday.empty-day{grid-template-columns:1fr;color:var(--muted)}
.wday.empty-day h3{font-weight:500}

@media (max-width:820px){
  table.grid{min-width:620px}
  .grid th.row{width:76px;font-size:11px}
}
@media (max-width:640px){
  body{font-size:14px;padding-block:14px 32px}
  .wrap{gap:14px}
  .panel{padding:16px}
  .top{gap:14px}
  .status{gap:12px}
  .scroll{display:none}
  .wlist{display:grid}
  .week-head{flex-direction:column;align-items:flex-start}
  .today-head{flex-direction:column;align-items:flex-start}
  .day-tabs button{padding:6px 10px;font-size:13px}
  .legend button{padding:5px 12px}
  ol.periods li{grid-template-columns:20px minmax(0,1fr) auto;grid-template-areas:"n t tag" "n s tag";row-gap:0;padding:8px}
  ol.periods li .n{grid-area:n}
  ol.periods li .t{grid-area:t;font-size:12px}
  ol.periods li .s{grid-area:s;white-space:normal}
  ol.periods li .tag{grid-area:tag}
  ol.periods li.empty .t{grid-row:1 / span 2;align-self:center}
  ol.periods li.empty .s{display:none}
  .next{flex-direction:column;align-items:flex-start}
  .next .cd{font-size:26px}
  .stat .v{font-size:20px}
  .ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ctrl > .label{grid-column:1 / -1}
  .ctrl label{display:grid;gap:4px}
  .ctrl select,.ctrl input[type=time]{width:100%;padding:8px}
  .ctrl button{padding:9px 10px}
  #simNote{grid-column:1 / -1}
}
@media (max-width:360px){
  .wday .cell em{width:74px;font-size:11px}
  .ctrl{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="label">1-р ээлж · Мэдээллийн технологи</div>
      <h1>Хичээлийн хуваарь</h1>
    </div>
    <div class="clock" aria-live="off">
      <div class="time" id="clock">--:--<span class="sec">:--</span></div>
      <div class="date" id="date">&nbsp;</div>
    </div>
  </header>

  <div class="top">
    <section class="panel status" id="status" aria-live="polite">
      <div class="state-chip"><span class="dot"></span><span id="stateText">Ачааллаж байна</span></div>
      <div>
        <p class="now-title" id="nowTitle">&nbsp;</p>
        <div class="now-sub" id="nowSub">&nbsp;</div>
      </div>
      <div id="progressBlock">
        <div class="big-left" id="bigLeft">&nbsp;</div>
        <div class="bar" style="margin-top:12px"><i id="barFill"></i></div>
        <div class="bar-meta mono"><span id="barStart"></span><span id="barPct"></span><span id="barEnd"></span></div>
      </div>
      <div class="next">
        <div>
          <div class="label">Дараагийн хичээл</div>
          <div id="nextTitle" style="font-weight:600">&nbsp;</div>
          <div id="nextWhen" class="now-sub" style="margin-top:0">&nbsp;</div>
        </div>
        <div class="cd" id="nextCd">--:--:--</div>
      </div>
    </section>

    <section class="panel today">
      <div class="today-head">
        <h2 id="dayTitle">Өнөөдөр</h2>
        <div class="day-tabs" id="dayTabs" role="group" aria-label="Гараг сонгох"></div>
      </div>
      <ol class="periods" id="periods"></ol>
    </section>
  </div>

  <section class="panel week">
    <div class="week-head">
      <h2>Долоо хоногийн хуваарь</h2>
      <div class="legend" id="legend" role="group" aria-label="Анги шүүх"></div>
    </div>
    <div class="scroll"><table class="grid" id="grid"></table></div>
    <div class="wlist" id="wlist"></div>
    <div id="detail" class="detail" hidden></div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="panel">
    <div class="ctrl">
      <span class="label" style="margin-right:4px">Цаг турших</span>
      <label for="simDay">Гараг <select id="simDay"></select></label>
      <label for="simTime">Цаг <input type="time" id="simTime" step="60"></label>
      <button id="simApply" type="button">Харах</button>
      <button id="simReset" type="button">Одоогийн цаг руу буцах</button>
      <span id="simNote"></span>
    </div>
  </section>

  <footer>Эх сурвалж: таны илгээсэн Excel файлын «1-р ээлж» хуудас. Цаг таны төхөөрөмжийн цагаар явна.</footer>
</div>

<script>
(function(){
  // ---- Data from the spreadsheet ----
  const DAYS=["Даваа","Мягмар","Лхагва","Пүрэв","Баасан","Бямба","Ням"]; // index 0 = Monday
  const PERIODS=[["08:30","09:10"],["09:10","09:50"],["09:55","10:35"],["10:35","11:15"],["11:20","12:00"],["12:40","13:20"],["13:20","14:00"],["14:05","14:45"],["14:50","15:30"]];
  // [day, periodIndex, grade, class]
  const RAW=[
    [1,0,8,"8а"],[4,0,6,"6а"],
    [1,1,8,"8а"],[4,1,6,"6а"],
    [4,2,7,"7а"],
    [0,3,11,"11а"],[2,3,10,"10а"],[3,3,7,"7а"],[4,3,7,"7а"],
    [0,4,11,"11а"],[2,4,10,"10а"],[3,4,7,"7а"],
    [1,5,12,"12а"],[3,5,8,"8а"],
    [1,6,12,"12а"],[3,6,8,"8а"],[4,6,6,"6б"],
    [1,7,9,"9а"],[4,7,6,"6б"],
    [1,8,9,"9а"]
  ];
  const HUE={6:200,7:150,8:265,9:330,10:25,11:45,12:180};
  const lesson=(g,c)=>({grade:g,cls:c,subject:`Мэдээллийн технологи ${g}`,code:`МТИ ${g}101`,kind:"Заавал судлах"});
  const S=DAYS.map(()=>PERIODS.map(()=>null));
  RAW.forEach(([d,p,g,c])=>{S[d][p]=lesson(g,c)});
  const toMin=s=>{const [h,m]=s.split(":").map(Number);return h*60+m};
  const P=PERIODS.map(([a,b],i)=>({i,a,b,start:toMin(a),end:toMin(b)}));

  const MONTHS=n=>`${n}-р сар`;
  const pad=n=>String(n).padStart(2,"0");
  const fmtDur=sec=>{sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return `${pad(h)}:${pad(m)}:${pad(s)}`};
  const fmtMinWords=sec=>{const m=Math.ceil(sec/60);if(m<60)return `${m} мин`;const h=Math.floor(m/60),r=m%60;return r?`${h} ц ${r} мин`:`${h} цаг`};
  const $=id=>document.getElementById(id);

  // ---- Time source (real or simulated) ----
  let simOffset=0; // ms added to real time
  const now=()=>new Date(Date.now()+simOffset);
  const dayIdx=d=>(d.getDay()+6)%7;

  let selectedDay=null; // null = follow today
  let hidden=new Set();
  let lastKey="";

  // ---- Build static UI ----
  const grades=[...new Set(RAW.map(r=>r[3]))].sort((a,b)=>parseInt(a)-parseInt(b)||a.localeCompare(b));
  const legend=$("legend");
  grades.forEach(c=>{
    const b=document.createElement("button");b.type="button";b.textContent=c;b.setAttribute("aria-pressed","true");
    b.style.setProperty("--h",HUE[parseInt(c)]);
    b.onclick=()=>{hidden.has(c)?hidden.delete(c):hidden.add(c);b.setAttribute("aria-pressed",String(!hidden.has(c)));renderGrid(now(),true)};
    legend.appendChild(b);
  });
  const tabs=$("dayTabs");
  DAYS.forEach((d,i)=>{const b=document.createElement("button");b.type="button";b.textContent=d.slice(0,2);b.title=d;b.dataset.i=i;
    b.onclick=()=>{selectedDay=(selectedDay===i&&i===dayIdx(now()))?null:i;render(true)};tabs.appendChild(b)});
  const simDay=$("simDay");DAYS.forEach((d,i)=>{const o=document.createElement("option");o.value=i;o.textContent=d;simDay.appendChild(o)});

  // stats
  const total=RAW.length,classes=grades.length;
  const perDay=DAYS.map((_,d)=>S[d].filter(Boolean).length);
  const busiest=perDay.indexOf(Math.max(...perDay));
  $("stats").innerHTML=[
    ["Долоо хоногт",`${total}`,"цаг хичээл"],
    ["Анги бүлэг",`${classes}`,grades.join(", ")],
    ["Хамгийн их",`${perDay[busiest]}`,`${DAYS[busiest]} гарагт`],
    ["Нийт хичээлийн цаг",`${Math.round(total*40/60*10)/10}`,"цаг (40 мин × "+total+")"]
  ].map(([l,v,s])=>`<div class="stat"><div class="label">${l}</div><div class="v">${v}</div><div class="now-sub" style="margin:0;font-size:12px">${s}</div></div>`).join("");

  // ---- Core: where are we in the week? ----
  function locate(d){
    const di=dayIdx(d), t=d.getHours()*60+d.getMinutes()+d.getSeconds()/60;
    let cur=null,gap=null;
    for(const p of P){ if(t>=p.start&&t<p.end){cur=p;break} }
    if(!cur){ for(let k=0;k<P.length-1;k++){ if(t>=P[k].end&&t<P[k+1].start){gap={from:P[k],to:P[k+1]};break} } }
    return {di,t,cur,gap};
  }
  function findNext(d){
    // next lesson start strictly after now, scanning up to 8 days ahead
    const base=new Date(d);base.setHours(0,0,0,0);
    for(let k=0;k<8;k++){
      const day=new Date(base);day.setDate(base.getDate()+k);
      const di=dayIdx(day);
      for(const p of P){
        if(!S[di][p.i])continue;
        const st=new Date(day);st.setHours(Math.floor(p.start/60),p.start%60,0,0);
        if(st>d)return {date:st,di,p,lesson:S[di][p.i],daysAhead:k};
      }
    }
    return null;
  }

  function render(force){
    const d=now(), L=locate(d), di=L.di;
    // clock
    $("clock").innerHTML=`${pad(d.getHours())}:${pad(d.getMinutes())}<span class="sec">:${pad(d.getSeconds())}</span>`;
    $("date").innerHTML=`${d.getFullYear()} оны ${MONTHS(d.getMonth()+1)}ын ${d.getDate()}, ${DAYS[di]}`+(simOffset?'<span class="sim-badge">туршилт</span>':"");

    // status
    const st=$("status"); const secNow=L.t*60;
    let state,color,title,sub,showBar=true,start=0,end=0,leftSec=0;
    const todayHas=S[di].some(Boolean);
    const firstToday=P.find(p=>S[di][p.i]), lastToday=[...P].reverse().find(p=>S[di][p.i]);
    if(L.cur && S[di][L.cur.i]){
      const ls=S[di][L.cur.i];
      state="Хичээл орж байна";color="var(--live)";
      title=`${ls.subject} · ${ls.cls} анги`;sub=`${L.cur.i+1}-р цаг · ${ls.code} · ${ls.kind}`;
      start=L.cur.start;end=L.cur.end;
    } else if(!todayHas){
      state=di>=5?"Амралтын өдөр":"Өнөөдөр хичээлгүй";color="var(--free)";
      title=di>=5?"Өнөөдөр амралтын өдөр":"Өнөөдөр танд хичээл алга";sub="Дараагийн хичээлийг доороос харна уу";showBar=false;
    } else if(L.t<P[0].start || (firstToday && L.t<firstToday.start && !L.cur && !L.gap)){
      state="Хичээл эхлээгүй";color="var(--accent)";
      title=`Өнөөдөр ${S[di].filter(Boolean).length} цаг хичээлтэй`;sub=`Эхний хичээл ${firstToday.a}-д эхэлнэ`;showBar=false;
    } else if(L.t>=lastToday.end){
      state="Өнөөдрийн хичээл дууслаа";color="var(--free)";
      title="Өнөөдрийн бүх хичээл дууссан";sub=`Сүүлийн хичээл ${lastToday.b}-д дууссан`;showBar=false;
    } else if(L.cur){
      state="Чөлөөт цаг";color="var(--free)";
      title=`${L.cur.i+1}-р цаг танд хичээлгүй`;sub=`${L.cur.a}–${L.cur.b}`;start=L.cur.start;end=L.cur.end;
    } else if(L.gap){
      const long=L.gap.to.start-L.gap.from.end>=30;
      state=long?"Үдийн завсарлага":"Завсарлага";color="var(--accent)";
      title=long?"Үдийн завсарлага":`${L.gap.from.i+1}- ба ${L.gap.to.i+1}-р цагийн хооронд`;
      sub=`${L.gap.from.b}–${L.gap.to.a}`;start=L.gap.from.end;end=L.gap.to.start;
    } else { state="Хичээлийн бус цаг";color="var(--free)";title="Одоогоор хичээл алга";sub="";showBar=false }
    st.style.setProperty("--state",color);
    st.classList.toggle("is-live",state==="Хичээл орж байна");
    $("stateText").textContent=state;$("nowTitle").textContent=title;$("nowSub").textContent=sub;
    $("progressBlock").hidden=!showBar;
    if(showBar){
      leftSec=end*60-secNow;const pct=Math.min(100,Math.max(0,(secNow-start*60)/((end-start)*60)*100));
      $("bigLeft").innerHTML=`${fmtDur(leftSec).replace(/^00:/,"")}<small>үлдлээ</small>`;
      $("barFill").style.width=pct.toFixed(2)+"%";
      $("barStart").textContent=`${pad(Math.floor(start/60))}:${pad(start%60)}`;
      $("barEnd").textContent=`${pad(Math.floor(end/60))}:${pad(end%60)}`;
      $("barPct").textContent=Math.floor(pct)+"%";
    }
    // next
    const nx=findNext(d);
    if(nx){
      const when=nx.daysAhead===0?"Өнөөдөр":nx.daysAhead===1?"Маргааш":DAYS[nx.di]+" гарагт";
      $("nextTitle").textContent=`${nx.lesson.subject} · ${nx.lesson.cls}`;
      $("nextWhen").textContent=`${when}, ${nx.p.i+1}-р цаг · ${nx.p.a}`;
      const s=(nx.date-d)/1000;$("nextCd").textContent=s>86400?fmtMinWords(s):fmtDur(s);
      document.title=(state==="Хичээл орж байна"?`▶ ${fmtDur(leftSec).replace(/^00:/,"")} · `:`${fmtDur(s)} · `)+"МТ хичээлийн хуваарь";
    }

    // day list + grid only when minute/period changes
    const key=[di,Math.floor(L.t),selectedDay,simOffset?1:0].join("|");
    if(force||key!==lastKey){lastKey=key;renderDay(d,L);renderGrid(d)}
  }

  function renderDay(d,L){
    const today=L.di, show=selectedDay??today;
    [...tabs.children].forEach(b=>{const i=+b.dataset.i;b.setAttribute("aria-pressed",String(i===show));b.classList.toggle("is-today",i===today)});
    $("dayTitle").textContent=show===today?`Өнөөдөр · ${DAYS[show]}`:DAYS[show];
    const ol=$("periods");ol.innerHTML="";
    P.forEach(p=>{
      if(p.i===5){const lu=document.createElement("li");lu.className="lunch";lu.textContent="12:00–12:40 · үдийн завсарлага";ol.appendChild(lu)}
      const ls=S[show][p.i],li=document.createElement("li");
      let tag="";
      if(show===today){
        if(L.t>=p.end){li.classList.add("done");if(ls)tag='<span class="tag fin">дууссан</span>'}
        else if(L.t>=p.start){li.classList.add("cur");if(ls)tag='<span class="tag live">явж байна</span>'}
        else if(ls&&p.start-L.t<=30)tag=`<span class="tag soon">${Math.ceil(p.start-L.t)} мин дараа</span>`;
      }
      if(ls){li.classList.add("has");li.style.setProperty("--h",HUE[ls.grade])}else li.classList.add("empty");
      li.innerHTML=`<span class="n mono">${p.i+1}</span><span class="t mono">${p.a}–${p.b}</span><span class="s">${ls?`${ls.cls} анги · ${ls.code}`:"—"}</span>${tag}`;
      ol.appendChild(li);
    });
  }

  function renderGrid(d){
    const L=locate(d), today=L.di;
    let h='<colgroup><col style="width:96px">'+DAYS.map((_,i)=>i>=5?'<col class="wk">':'<col>').join("")+'</colgroup>';
    h+='<thead><tr><th class="row"></th>'+DAYS.map((n,i)=>`<th class="${i===today?"today-col":""}">${i>=5?n.slice(0,2):n}</th>`).join("")+'</tr></thead><tbody>';
    P.forEach(p=>{
      if(p.i===5)h+=`<tr><th class="row"></th><td class="lunch-row" colspan="7">12:00–12:40 · үдийн завсарлага</td></tr>`;
      const curRow=L.cur&&L.cur.i===p.i;
      h+=`<tr><th class="row${curRow?" cur-row":""}">${p.a}<br>${p.b}</th>`;
      DAYS.forEach((_,di)=>{
        const ls=S[di][p.i];const tc=di===today?"today-col":"";
        if(!ls){h+=`<td class="${tc}"></td>`;return}
        const isNow=di===today&&curRow;const dim=hidden.has(ls.cls);
        h+=`<td class="${tc}"><button type="button" class="cell${isNow?" is-now":""}${dim?" dim":""}" style="--h:${HUE[ls.grade]}" data-d="${di}" data-p="${p.i}" aria-label="${DAYS[di]}, ${p.a}, ${ls.cls} анги"><b>${ls.cls}</b><span>${ls.code}</span></button></td>`;
      });
      h+='</tr>';
    });
    $("grid").innerHTML=h+'</tbody>';

    // phone view: one card per day
    let w="";
    DAYS.forEach((n,di)=>{
      const items=P.filter(p=>S[di][p.i]);
      const tc=di===today?" is-today":"";
      if(!items.length){w+=`<div class="wday empty-day${tc}"><h3>${n}<small>хичээлгүй</small></h3></div>`;return}
      w+=`<div class="wday${tc}"><h3>${n}${di===today?" · өнөөдөр":""}<small>${items.length} цаг</small></h3>`;
      items.forEach(p=>{
        const ls=S[di][p.i];const isNow=di===today&&L.cur&&L.cur.i===p.i;const dim=hidden.has(ls.cls);
        w+=`<button type="button" class="cell${isNow?" is-now":""}${dim?" dim":""}" style="--h:${HUE[ls.grade]}" data-d="${di}" data-p="${p.i}" aria-label="${n}, ${p.a}, ${ls.cls} анги"><em>${p.a}–${p.b}</em><b>${ls.cls}</b><span>${ls.code}</span></button>`;
      });
      w+='</div>';
    });
    $("wlist").innerHTML=w;
  }

  document.querySelector(".week").addEventListener("click",e=>{
    const c=e.target.closest(".cell");if(!c)return;
    const di=+c.dataset.d,pi=+c.dataset.p,ls=S[di][pi],p=P[pi];
    const sameClass=RAW.filter(r=>r[3]===ls.cls).length;
    const box=$("detail");box.hidden=false;box.style.setProperty("--h",HUE[ls.grade]);
    box.innerHTML=`<strong>${ls.subject} (${ls.code})</strong> · ${ls.kind}<br>${DAYS[di]} гараг, ${pi+1}-р цаг, ${p.a}–${p.b} · ${ls.cls} анги · энэ ангид долоо хоногт ${sameClass} цаг`;
    selectedDay=di;render(true);
  });

  // simulation controls
  function syncSimInputs(){const d=now();simDay.value=dayIdx(d);$("simTime").value=`${pad(d.getHours())}:${pad(d.getMinutes())}`}
  $("simApply").onclick=()=>{
    const v=$("simTime").value;if(!v)return;
    const [hh,mm]=v.split(":").map(Number);const real=new Date();
    const target=new Date(real);target.setDate(real.getDate()+(+simDay.value-dayIdx(real)));target.setHours(hh,mm,0,0);
    simOffset=target-real;selectedDay=null;$("simNote").textContent=`${DAYS[+simDay.value]} ${v} цагаас эхлэн явж байна`;render(true);
  };
  $("simReset").onclick=()=>{simOffset=0;selectedDay=null;$("simNote").textContent="";syncSimInputs();render(true)};

  syncSimInputs();render(true);
  setInterval(()=>render(false),1000);
})();
</script>

</body></html>
